# 曲を始めるとき(最初)にユーザーが指示した内容。AI は候補を出さず、ユーザーの指示をそのまま書く。
# 指示が無い項目は空のまま(AI が補わない。必要なら本人に聞き直す)。
# コード進行(ユーザー指定)。genre_apply.py が 02-harmony に反映する
progression: []   # 例: [{bars: 2, chord: Am}, {bars: 2, chord: F}]
# 作るトラックと、そのトラックの音(ユーザー指定)。これ以外のトラックは作らない
tracks: []
# 例:
#   - {spec: 03-drums, track: drums, label: ドラム, sound: "ユーザーの言葉のまま", patch: my_kit}
#   - {spec: 10-hit, track: hit, label: 掛け声, sound: "自分で録った声", patch: my_voice_hit}   # patch の sample: は synth/patches.yaml 側
# patch は projects/<song>/synth/patches.yaml の ID。sound はユーザーの言葉(音を作る根拠。AI の解釈で変えない)

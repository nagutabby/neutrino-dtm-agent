[project]
name = "sonicpi-live-agent"
version = "0.2.0"
description = "Sonic Pi のライブコーディングで曲を作るユーザーを、改善案・次のステム提案・最終レビューで支援する AI エージェント用リポジトリ"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 日本語メッセージは幅が広いため行長は検査しない

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

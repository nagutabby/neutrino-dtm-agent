[project]
name = "neutrino-dtm-agent"
version = "0.1.0"
description = "NEUTRINO を使った DTM を、スペック駆動で初心者を支援する AI エージェント用リポジトリ"
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3",
  "pyyaml>=6",
  "lxml>=5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
reference = [
    "basic-pitch>=0.4.0",
    "demucs>=4.1.0",
    "librosa>=0.11.0",
    "onnxruntime>=1.31.0",
    "setuptools<81",
    "soundfile>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 日本語メッセージは幅が広いため行長は検査しない

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.uv]
# basic-pitch は macOS で tensorflow-macos を要求するが cp312 wheel が無い。ONNX 推論を使うので除外する。
override-dependencies = ["tensorflow-macos; sys_platform == 'never'", "tensorflow; sys_platform == 'never'"]
